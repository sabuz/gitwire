name: Code Quality Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Run JS lint
        run: npm run lint:js

      - name: Run SCSS lint
        run: npm run lint:scss

      - name: Build assets
        run: npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPCS
        run: composer phpcs

      - name: Run PHPStan
        run: composer phpstan

      - name: Run PHPUnit
        run: composer phpunit

      # Check what actually ships, not the repo. .gitattributes export-ignore keeps
      # src/, tests/, and the dev configs out of the distributed ZIP.
      - name: Stage the distribution
        run: |
          mkdir -p dist/gitwire
          git archive --worktree-attributes HEAD | tar -x -C dist/gitwire
          cp -r build dist/gitwire/build

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './dist/gitwire'
          ignore-warnings: true
