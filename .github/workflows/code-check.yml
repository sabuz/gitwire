name: Code Quality Check

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Install npm dependencies
        run: npm install --no-audit --no-fund

      - name: Run JS lint
        run: npm run lint:js

      - name: Run SCSS lint
        run: npm run lint:scss

      - name: Build assets
        run: npm run build

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          tools: composer

      - name: Install Composer dependencies
        run: composer install --no-progress --prefer-dist

      - name: Run PHPCS
        run: composer phpcs

      - name: Run PHPStan
        run: composer phpstan

      - name: Run PHPUnit
        run: composer phpunit

      # Check the distribution rather than the repository. The export-ignore rules in
      # .gitattributes exclude src/, tests/, and development configuration files.
      - name: Stage the distribution
        run: |
          mkdir -p dist/gitwire
          git archive --worktree-attributes HEAD | tar -x -C dist/gitwire
          cp -r build dist/gitwire/build

      - name: Run WordPress Plugin Check
        uses: wordpress/plugin-check-action@v1
        with:
          build-dir: './dist/gitwire'
          ignore-warnings: true
          # Plugin Check reports plugin_updater_detected for the
          # site_transient_update_plugins filter in class-installer.php. The filter
          # removes Gitwire-managed installs from WordPress.org update results so
          # those updates cannot overwrite code tracked in Git. Plugin Check matches
          # the string and does not distinguish removal from registration.
          #
          # Ignore this check in CI so it does not obscure unrelated regressions. Do
          # not suppress it for review: Plugin Check will report it in the submitted
          # ZIP. See issue #84 and docs/wporg-compliance.md for the rationale. Remove
          # the filter and this ignore if the reviewer does not accept it.
          ignore-codes: plugin_updater_detected
