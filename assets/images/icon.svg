      Left half-circle clip: counterclockwise arc from top (128,4) to bottom (128,252)
      sweeps the left side of the circle, then closes along the left edge.
    -->
    <clipPath id="leftHalf">
      <path d="M 128,4 A 124,124 0 0,0 128,252 L 0,252 L 0,4 Z"/>
    </clipPath>
    <!--
      Right half-circle clip: clockwise arc from top (128,4) to bottom (128,252)
      sweeps the right side, then closes along the right edge.
    -->
    <clipPath id="rightHalf">
      <path d="M 128,4 A 124,124 0 0,1 128,252 L 256,252 L 256,4 Z"/>
    </clipPath>
