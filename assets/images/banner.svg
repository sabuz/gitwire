<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 772 250" width="772" height="250">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="65%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#0a2a3d"/>
    </linearGradient>
    <linearGradient id="divider" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#21759b" stop-opacity="0"/>
      <stop offset="50%" stop-color="#21759b" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#21759b" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="772" height="250" fill="url(#bg)"/>

  <!-- GitHub Octocat — left side, large and slightly faded -->
  <g transform="translate(18, 8) scale(14.625)" opacity="0.92">
    <path fill="white" d="M8 0c4.42 0 8 3.58 8 8a8.013 8.013 0 0 1-5.45 7.59c-.4.08-.55-.17-.55-.38 0-.27.01-1.13.01-2.2 0-.75-.25-1.23-.54-1.48 1.78-.2 3.65-.88 3.65-3.95 0-.88-.31-1.59-.82-2.15.08-.2.36-1.02-.08-2.12 0 0-.67-.22-2.2.82-.64-.18-1.32-.27-2-.27-.68 0-1.36.09-2 .27-1.53-1.03-2.2-.82-2.2-.82-.44 1.1-.16 1.92-.08 2.12-.51.56-.82 1.28-.82 2.15 0 3.06 1.86 3.75 3.64 3.95-.23.2-.44.55-.51 1.07-.46.21-1.61.55-2.33-.66-.15-.24-.6-.83-1.23-.82-.67.01-.27.38.01.53.34.19.73.9.82 1.13.16.45.68 1.31 2.69.94 0 .67.01 1.3.01 1.49 0 .21-.15.45-.55.38A7.995 7.995 0 0 1 0 8c0-4.42 3.58-8 8-8Z"/>
  </g>

  <!-- Thin vertical divider -->
  <rect x="262" y="0" width="1" height="250" fill="url(#divider)"/>

  <!-- Plugin name — right of divider, vertically centered -->
  <!-- "GitHub" -->
  <text x="298" y="112"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700"
        font-size="64"
        fill="white"
        letter-spacing="-1">GitHub</text>

  <!-- "for" -->
  <text x="302" y="160"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="400"
        font-size="26"
        fill="#8b949e"
        letter-spacing="2">for</text>

  <!-- "WordPress" in WP blue -->
  <text x="298" y="210"
        font-family="'Segoe UI', Helvetica, Arial, sans-serif"
        font-weight="700"
        font-size="64"
        fill="#21759b"
        letter-spacing="-1">WordPress</text>

  <!-- WordPress badge — far right -->
  <circle cx="710" cy="125" r="72" fill="#0d1117"/>
  <circle cx="710" cy="125" r="64" fill="#21759b"/>
  <polyline
    points="676,157 690,93 710,138 730,93 744,157"
    fill="none"
    stroke="white"
    stroke-width="8.5"
    stroke-linecap="round"
    stroke-linejoin="round"/>
</svg>
